## IDF Component Manager Manifest File
dependencies:
  espressif/esp_wifi_remote:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=1.6,<2.0"
      - if: "idf_version < 6.0"
        version: "0.14.*"

  espressif/esp_hosted:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=2.12,<3.0"
      - if: "idf_version < 6.0"
        version: "1.4.*"

  # ES8311 audio codec (onboard, I2C control). Deprecated in favour of esp_codec_dev
  # for full audio pipelines, but it's a well-tested, official driver and sufficient
  # for our simple need (power on + play a synthesized alert tone) -- preferred over
  # hand-porting the Arduino prototype's raw I2C register sequence.
  espressif/es8311: "1.0.0~1"

  idf:
    version: ">=4.1.0"
