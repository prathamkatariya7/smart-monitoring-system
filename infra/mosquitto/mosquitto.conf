listener 8883
protocol mqtt

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true

allow_anonymous false

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Message size / queue hardening (added 2026-11-12 audit).
# Prevents a misbehaving or compromised device from flooding the broker.
message_size_limit 65536
max_inflight_messages 20
max_queued_messages 1000

# Part 8.2: topics are rmp/v1/{device_id}/... ; ACL is enforced per-device by
# certificate CN == device_id, configured via acl_file once device certs are
# issued through the claim flow (devices module). For local bench/dev testing
# with the device simulator, acl_file is added once certs exist:
# acl_file /mosquitto/config/acl.conf
